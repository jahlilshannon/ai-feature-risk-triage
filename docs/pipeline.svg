<svg width="680" height="460" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" role="img">
<title>Feature risk triage assessment pipeline</title>
<desc>A feature description enters a domain-neutral questionnaire, then scoring, which draws severity meaning from a swappable domain profile. Output splits into assessment, recommendation, and open questions for a human.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="220" y="40" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="60" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A" font-size="14" font-weight="500">Feature description</text>
<text x="340" y="78" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-size="12">One way in</text>
<line x1="340" y1="96" x2="340" y2="130" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="220" y="136" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="156" text-anchor="middle" dominant-baseline="central" fill="#3C3489" font-size="14" font-weight="500">Questionnaire</text>
<text x="340" y="174" text-anchor="middle" dominant-baseline="central" fill="#534AB7" font-size="12">Ten neutral dimensions</text>
<line x1="340" y1="192" x2="340" y2="226" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="220" y="232" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="252" text-anchor="middle" dominant-baseline="central" fill="#3C3489" font-size="14" font-weight="500">Scoring</text>
<text x="340" y="270" text-anchor="middle" dominant-baseline="central" fill="#534AB7" font-size="12">Three risk dimensions</text>
<rect x="40" y="232" width="150" height="76" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1" stroke-dasharray="5 4"/>
<text x="115" y="256" text-anchor="middle" dominant-baseline="central" fill="#085041" font-size="14" font-weight="500">Domain profile</text>
<text x="115" y="276" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-size="12">What severe means</text>
<text x="115" y="292" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-size="12">One per industry</text>
<line x1="190" y1="260" x2="214" y2="260" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="288" x2="340" y2="314" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="140" y1="314" x2="540" y2="314" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="140" y1="314" x2="140" y2="334" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="314" x2="340" y2="334" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="540" y1="314" x2="540" y2="334" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="50" y="340" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="140" y="360" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A" font-size="14" font-weight="500">Assessment</text>
<text x="140" y="378" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-size="12">By evidence type</text>
<rect x="250" y="340" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="360" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A" font-size="14" font-weight="500">Recommendation</text>
<text x="340" y="378" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-size="12">Conditions attached</text>
<rect x="450" y="340" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="540" y="360" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A" font-size="14" font-weight="500">Open questions</text>
<text x="540" y="378" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-size="12">A human answers</text>
<text x="340" y="428" text-anchor="middle" fill="#5F5E5A" font-size="12">Dashed border marks the swappable extension point</text>
</svg>
